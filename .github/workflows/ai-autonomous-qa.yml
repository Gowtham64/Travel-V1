name: VoyPlan Autonomous AI QA & Bug-Fixing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run continuous autonomous QA cycle every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  autonomous-engineering:
    name: AI QA & Verification Gate
    runs-on: macos-14 # Provides macOS runner for Flutter, Node, and iOS verification
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyyaml requests pytest

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend && npm ci

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile && flutter pub get

      - name: Run Master AI Orchestrator Single-Pass
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MODEL_PROVIDER: "gemini"
          MODEL_NAME: "gemini-1.5-flash"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 ai/agents/orchestrator.py

      - name: Upload AI Memory & Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-qa-evidence
          path: |
            ai/memory/
            ai/evidence/
          retention-days: 14
