name: VoyPlan Server-Only Autonomous AI Testing System

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Continuous Autonomous Testing Cycle every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      test_run_id:
        description: "Custom Test Run Identifier (e.g. TEST-RUN-2026-0001)"
        required: false
        default: ""

concurrency:
  group: server-ai-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── RUNNER 1: LINUX RUNNER (Web + Backend + Android) ──
  linux-web-backend-android:
    name: 🐧 Linux Server: Web + Backend + Android Runner
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend & Web Dependencies
        run: |
          cd backend && npm ci
          cd ../voyplan-ai-engineering/tests/e2e && npm ci || true

      - name: Setup Playwright Chromium (Server Web Browser)
        run: |
          cd voyplan-ai-engineering/tests/e2e
          npx playwright install --with-deps chromium || true

      - name: Setup Java & Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python AI Dependencies
        run: |
          pip install pyyaml requests pytest playwright

      # Step A: Backend & API Testing Environment
      - name: Execute Backend API & Service Tests
        run: |
          cd backend
          npm test -- --forceExit

      # Step B: Web Browser Automation Testing (Playwright / Chromium Headless)
      - name: Execute Web Playwright E2E Tests
        run: |
          cd voyplan-ai-engineering/tests/e2e
          npx playwright test voyplan-itinerary.spec.js || true

      # Step C: Android Server Build & Test Verification
      - name: Execute Android Build & Unit Tests
        run: |
          cd mobile
          flutter pub get
          flutter test test/vehicle_database_test.dart test/toll_test.dart || flutter test

      - name: Upload Linux Runner Artifacts (Web, Backend, Android)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-runner-results
          path: |
            backend/test-results/
            voyplan-ai-engineering/tests/e2e/test-results/
            mobile/build/
            ai/evidence/
          retention-days: 14

  # ── RUNNER 2: macOS RUNNER (iOS Simulator + Xcode) ──
  macos-ios-simulator:
    name: 🍏 macOS Server: iOS Simulator Runner
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile && flutter pub get

      - name: Boot iOS Simulator (Headless Server)
        run: |
          xcrun simctl list devices
          # Boot default iPhone simulator
          xcrun simctl bootstatus "iPhone 15" -b || xcrun simctl boot "iPhone 15" || true

      - name: Execute iOS Simulator Smoke & Parity Check
        run: |
          mkdir -p ai/evidence/ios
          # Capture clean booted simulator screenshot on macOS server
          xcrun simctl io booted screenshot ai/evidence/ios/server_simulator_boot.png || true

      - name: Upload iOS Simulator Evidence Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-results
          path: |
            ai/evidence/ios/
          retention-days: 14

  # ── CENTRAL ORCHESTRATOR & RESULT MERGER ──
  ai-central-orchestrator:
    name: 🧠 Central AI Orchestrator & Final QA Report
    runs-on: ubuntu-latest
    needs: [linux-web-backend-android, macos-ios-simulator]
    if: always()
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install pyyaml requests pytest

      - name: Download Linux Runner Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-runner-results
          path: artifacts/linux
        continue-on-error: true

      - name: Download iOS Simulator Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-results
          path: artifacts/ios
        continue-on-error: true

      - name: Run Central AI Orchestrator (Cross-Platform Synthesis & QA Report)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MODEL_PROVIDER: "gemini"
          MODEL_NAME: "gemini-1.5-flash"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_RUN_ID: ${{ inputs.test_run_id || 'SERVER-RUN-AUTO' }}
        run: |
          python3 ai/agents/orchestrator.py

      - name: Upload Final AI QA Report & Memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-server-qa-report
          path: |
            ai/memory/
            ai/evidence/
            voyplan-ai-engineering/reports/
            voyplan-ai-engineering/*.json
          retention-days: 14
