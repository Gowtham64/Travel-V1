name: Deploy Production (Cloudflare Worker + Pages)

# The sole production deployment path. A failed validation, Worker deploy, or
# Worker health check prevents the Pages deployment from running.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        default: ''

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PAGES_PROJECT: voyplan

jobs:
  deploy:
    name: Validate, deploy Worker, then deploy Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify confirmation (manual runs)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::Production deploy not confirmed. Re-run and type DEPLOY in the confirm box."
          exit 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Flutter
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Validate Cloudflare credentials and Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing required GitHub secret: CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing required GitHub secret: CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          if [ -z "$PAGES_PROJECT" ] || [ "$PAGES_PROJECT" != "voyplan" ]; then
            echo "::error::Cloudflare Pages project name is empty."
            exit 1
          fi
          echo "Cloudflare authentication and fixed Pages project name detected."

      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Validate Worker typecheck
        working-directory: cloudflare-worker
        run: npm run build

      - name: Validate Worker tests
        working-directory: cloudflare-worker
        run: npm test

      - name: Validate Worker bundle
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run

      - name: Deploy Cloudflare Worker
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify API health
        run: |
          curl --fail --show-error --silent --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 10 --max-time 30 \
            https://api.voyplan.in/health
          echo

      - name: Build Flutter web
        working-directory: mobile
        run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=APP_ENV=production \
            --dart-define=BACKEND_URL=https://api.voyplan.in \
            --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}

      - name: Add Pages headers and SPA fallback
        run: |
          cp cloudflare/_headers mobile/build/web/_headers
          cp cloudflare/_redirects mobile/build/web/_redirects
          test -f mobile/build/web/index.html

      - name: Confirm Cloudflare Pages project
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECTS="$(npx wrangler pages project list)"
          if ! printf '%s\n' "$PROJECTS" | grep -Fq "$PAGES_PROJECT"; then
            echo "::error::Cloudflare Pages project 'voyplan' was not found."
            exit 1
          fi

      - name: Deploy Cloudflare Pages
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy ../mobile/build/web --project-name="$PAGES_PROJECT"

      - name: Production smoke tests
        run: bash scripts/smoke-test.sh https://voyplan.in https://api.voyplan.in
