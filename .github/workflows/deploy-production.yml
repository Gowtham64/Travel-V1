name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Worker typecheck
        working-directory: cloudflare-worker
        run: npm run build

      - name: Worker tests
        working-directory: cloudflare-worker
        run: npm test

      - name: Worker dry run
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        working-directory: mobile
        run: flutter test

  deploy-api:
    name: Deploy Cloudflare Worker API
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare-worker
          command: deploy

      - name: Verify API health
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 15 https://api.voyplan.in/health; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Cloudflare Worker health check failed"
          exit 1

  deploy-web:
    name: Deploy Cloudflare Pages
    needs: deploy-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter Web
        working-directory: mobile
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          flutter pub get
          flutter build web --release \
            --base-href "/" \
            --dart-define=APP_ENV=production \
            --dart-define=BACKEND_URL=https://api.voyplan.in \
            --dart-define=MAPBOX_TOKEN="$MAPBOX_TOKEN"

      - name: Add Cloudflare Pages routing and headers
        run: |
          cp cloudflare/_headers mobile/build/web/_headers
          cp cloudflare/_redirects mobile/build/web/_redirects

      - name: Deploy Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy mobile/build/web --project-name=voyplan --commit-dirty=true

      - name: Verify production website
        run: |
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 https://voyplan.in/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production website health check failed"
          exit 1
