name: Deploy Production (Cloudflare Worker + Pages)

# Canonical production deployment workflow for VoyPlan.
# Deploys Cloudflare Worker (api.voyplan.in) and Cloudflare Pages (voyplan.in)
# solely from the main branch after full validation.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PAGES_PROJECT: voyplan

jobs:
  deploy:
    name: Validate, Deploy Worker, and Deploy Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare-worker/package-lock.json

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Cloudflare credentials and Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing required GitHub secret: CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing required GitHub secret: CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          if [ -z "$PAGES_PROJECT" ] || [ "$PAGES_PROJECT" != "voyplan" ]; then
            echo "::error::Cloudflare Pages project name must be 'voyplan'."
            exit 1
          fi
          echo "Cloudflare authentication and canonical Pages project verified."

      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm ci

      - name: Worker typecheck
        working-directory: cloudflare-worker
        run: npm run build

      - name: Worker tests
        working-directory: cloudflare-worker
        run: npm test

      - name: Worker dry-run
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run

      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter unit tests
        working-directory: mobile
        run: flutter test

      - name: Deploy Cloudflare Worker API
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Configure public Mapbox token for route preview
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          case "$MAPBOX_TOKEN" in
            pk.*) printf '%s' "$MAPBOX_TOKEN" | npx wrangler secret put MAPBOX_TOKEN ;;
            *) echo "::warning::MAPBOX_TOKEN is not a public pk.* token; route preview will use its live geometry fallback." ;;
          esac

      - name: Verify API health
        run: |
          echo "Verifying API health on https://api.voyplan.in/health..."
          curl --fail --show-error --silent --retry 6 --retry-all-errors \
            --retry-delay 5 --connect-timeout 10 --max-time 30 \
            https://api.voyplan.in/health
          echo

      - name: Build Flutter Web
        working-directory: mobile
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          flutter build web --release \
            --base-href "/app/" \
            --dart-define=APP_ENV=production \
            --dart-define=BACKEND_URL=https://api.voyplan.in \
            --dart-define=MAPBOX_TOKEN="$MAPBOX_TOKEN"

      - name: Assemble Cloudflare Pages deployment payload
        run: |
          mkdir -p mobile/build/web_flutter
          cp -R mobile/build/web/* mobile/build/web_flutter/
          rm -rf mobile/build/web
          mkdir -p mobile/build/web/app

          cp -R mobile/build/web_flutter/* mobile/build/web/app/
          rm -rf mobile/build/web_flutter

          cp web/index.html mobile/build/web/index.html
          if [ -d web/images ]; then
            cp -R web/images mobile/build/web/images
          fi
          cp mobile/web/favicon* mobile/build/web/ 2>/dev/null || true
          cp mobile/web/apple-touch-icon.png mobile/build/web/ 2>/dev/null || true
          cp cloudflare/_headers mobile/build/web/_headers
          cp cloudflare/_redirects mobile/build/web/_redirects
          test -f mobile/build/web/index.html
          test -f mobile/build/web/app/index.html

      - name: Confirm Cloudflare Pages project
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECTS="$(npx wrangler pages project list)"
          if ! printf '%s\n' "$PROJECTS" | grep -Fq "$PAGES_PROJECT"; then
            echo "::error::Cloudflare Pages project '$PAGES_PROJECT' was not found."
            exit 1
          fi

      - name: Deploy Cloudflare Pages
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy ../mobile/build/web --project-name="$PAGES_PROJECT" --commit-dirty=true

      - name: Production smoke tests
        run: bash scripts/smoke-test.sh https://www.voyplan.in https://api.voyplan.in
