name: Deploy Production (voyplan.in → Cloudflare Pages)

# EXPLICIT production deploy only — never automatic on every commit.
# Trigger manually (Actions tab → Run workflow) after staging QA + approval,
# OR on a version tag (v*). This publishes only the Flutter static build to
# Cloudflare Pages; the Node API remains an independent Render deployment.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm production deployment'
        required: true
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify confirmation (manual runs)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm != 'DEPLOY'
        run: |
          echo "::error::Production deploy not confirmed. Re-run and type DEPLOY in the confirm box."
          exit 1

      - name: Set up Node.js for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build web (PRODUCTION config — defaults are prod)
        working-directory: mobile
        run: |
          flutter pub get
          flutter build web --release \
            --base-href "/" \
            --dart-define=APP_ENV=production \
            --dart-define=BACKEND_URL=https://api.voyplan.in \
            --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}

      - name: Add Cloudflare Pages headers and SPA fallback
        run: |
          cp cloudflare/_headers mobile/build/web/_headers
          cp cloudflare/_redirects mobile/build/web/_redirects

      - name: Install pinned Wrangler
        run: npm install --global wrangler@3.114.0

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'voyplan' }}
        run: |
          wrangler pages deploy mobile/build/web \
            --project-name="$PAGES_PROJECT_NAME" \
            --commit-dirty=true
