name: Deploy Staging (develop → staging.voyplan.in)

# Auto-deploys the develop branch to the staging environment on Cloudflare Pages.
# Inert until the staging secrets exist (guard step below), so pushing this file
# never fails a build before the infra is set up.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Build + deploy to Cloudflare Pages (staging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check staging secrets are configured
        id: guard
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.STAGING_SUPABASE_URL }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Staging secrets not set yet — skipping deploy. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY, STAGING_BACKEND_URL, MAPBOX_TOKEN."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - name: Build web (STAGING config)
        if: steps.guard.outputs.ready == 'true'
        working-directory: mobile
        run: |
          flutter pub get
          flutter build web --release \
            --base-href "/app/" \
            --dart-define=APP_ENV=staging \
            --dart-define=SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }} \
            --dart-define=BACKEND_URL=${{ secrets.STAGING_BACKEND_URL }} \
            --dart-define=MAPBOX_TOKEN=${{ secrets.MAPBOX_TOKEN }}

      - name: Assemble site (landing + app) into ./public
        if: steps.guard.outputs.ready == 'true'
        run: |
          rm -rf public && mkdir -p public
          cp -R web/* public/ 2>/dev/null || true
          rm -rf public/app && mkdir -p public/app
          cp -R mobile/build/web/* public/app/
          # Staging must never be indexed by search engines.
          printf 'User-agent: *\nDisallow: /\n' > public/robots.txt
          touch public/.nojekyll

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=voyplan-staging --branch=develop
