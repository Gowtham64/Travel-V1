name: Mobile Build

# Phase 1 (mobilize) — build the native iOS & Android apps on CI, since local
# native toolchains aren't always available. Produces an installable Android APK
# and an unsigned iOS .app you can download from the run's Artifacts.

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # JDK 21: the maplibre_gl plugin's Android code targets Java 21
          # (AGP 8.11 / Gradle 8.14 both support running on JDK 21).
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      # Lints are informational here so a warning/info doesn't fail the build;
      # real compile errors still fail.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: travel-app-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS (no codesign)
    runs-on: macos-latest
    # Best-effort for now: an unsigned iOS build can't be installed on a device
    # anyway, and its failure cause still needs its build log. Don't let it block
    # the installable Android APK.
    continue-on-error: true
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      # Build for the SIMULATOR: verifies the iOS app compiles with zero Apple
      # account / signing team (a device build demands a Development Team even
      # with --no-codesign). Real device signing/distribution is Phase 5.
      - run: flutter build ios --debug --simulator

      - name: Package simulator .app
        run: |
          cd build/ios/iphonesimulator
          zip -r ../../../travel-app-ios-sim.zip Runner.app >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: travel-app-ios-sim
          path: mobile/travel-app-ios-sim.zip
          if-no-files-found: error

  # Publishes the freshly-built APK to a rolling "android-latest" GitHub Release
  # so the landing page's "Download for Android" button
  # (releases/latest/download/app-release.apk) always serves the newest build.
  # Only runs on a push to main — never on PRs — so releases stay under your
  # control and a PR can't publish anything.
  release:
    name: Publish APK release
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: travel-app-android-apk
          path: apk

      - name: Publish / update rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Latest Android build
          body: >
            Auto-published Android APK from the latest main build.
            Sideload on Android (enable "Install from unknown sources").
          files: apk/app-release.apk
          fail_on_unmatched_files: true
          make_latest: true
