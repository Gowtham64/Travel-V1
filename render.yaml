services:
  # VoyPlan AI Autonomous Engineering & QA Operations Hub
  - type: web
    name: voyplan-ai-engineering
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: voyplan-ai-engineering
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 dashboard/server.py"
    envVars:
      - key: MODEL_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MACOS_RUNNER_URL
        value: https://github.com/Gowtham64/Travel-V1
      - key: PORT
        value: 3050
      - key: PRODUCTION_URL
        value: https://voyplan.in
      - key: STAGING_URL
        value: https://staging.voyplan.in

