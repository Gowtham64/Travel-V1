services:
  # VoyPlan Node.js Backend API Service (api.voyplan.in)
  - type: web
    name: voyplan-backend
    env: node
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "node src/index.js"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: "https://voyplan.in,https://www.voyplan.in"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAPBOX_TOKEN
        sync: false
      - key: ORS_API_KEY
        sync: false
      - key: TOLLGURU_API_KEY
        sync: false

  # VoyPlan AI Autonomous Engineering & QA Operations Hub
  - type: web
    name: voyplan-ai-engineering
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: voyplan-ai-engineering
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 dashboard/server.py"
    healthCheckPath: /api/status
    envVars:
      - key: MODEL_PROVIDER
        value: gemini
      - key: MODEL_NAME
        value: gemini-flash-lite-latest
      - key: ENABLE_AUTONOMOUS_ENGINE
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MACOS_RUNNER_URL
        value: https://github.com/Gowtham64/Travel-V1
      - key: PORT
        value: 3050
      - key: PRODUCTION_URL
        value: https://voyplan.in
      - key: STAGING_URL
        value: https://staging.voyplan.in
