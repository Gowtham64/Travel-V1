name: travel_app
description: Travel itinerary planner - routing, fuel stops, tolls, and nearby places.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # flutter_map: pure-Dart, open-source OSM map widget (no native SDK setup required)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.2.2
  provider: ^6.1.2
  supabase_flutter: ^2.16.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.1.0
  sliding_up_panel: ^2.0.0+1
  share_plus: ^10.0.0
  geolocator: ^13.0.2
  maplibre_gl: ^0.26.2
  url_launcher: ^6.3.2
  pdf: ^3.13.0
  printing: ^5.15.0
  file_picker: ^11.0.3
  image: ^4.2.0
  photo_manager: ^3.6.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

# Voyplan app icon generation. Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/voyplan.png"
  android: true
  adaptive_icon_background: "#0f766e"
  adaptive_icon_foreground: "assets/icon/voyplan_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/voyplan.png"
    background_color: "#0f766e"
    theme_color: "#0f766e"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
