<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="travel_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>travel_app</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @keyframes ripple {
      0% {
        transform: scale(0.6);
        opacity: 1;
      }
      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }
    .pulsing-ring {
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2.5px solid #2E75B6;
      background-color: rgba(46, 117, 182, 0.25);
      animation: ripple 1.2s infinite ease-out;
      pointer-events: none;
      left: 0px;
      top: 0px;
    }
    .vehicle-emoji-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      font-size: 24px;
      line-height: 1;
    }
    @keyframes wobble-bounce {
      0% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(-3deg); }
      50% { transform: translateY(0px) rotate(0deg); }
      75% { transform: translateY(-3px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    .driving-wobble {
      animation: wobble-bounce 0.4s infinite linear;
      transform-origin: center bottom;
    }
  </style>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet" />
  <!-- Three.js: renders a real 3D vehicle (built from primitives at real-world
       metre dimensions) on the Mapbox v3 map via a native custom layer. -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script>
    // Approximate real-world size (metres) + colour per vehicle type. The model
    // is built at these dimensions and scaled via meterInMercatorCoordinateUnits,
    // so it is always the correct physical size (then exaggerated for visibility).
    window.VEHICLE_3D_SPECS = {
      car:        { len: 4.4, wid: 1.9, hgt: 1.5, color: 0x2E75B6 },
      suv:        { len: 4.8, wid: 2.0, hgt: 1.8, color: 0x1B5E20 },
      motorcycle: { len: 2.1, wid: 0.8, hgt: 1.2, color: 0xB71C1C },
      bus:        { len: 11.0, wid: 2.5, hgt: 3.2, color: 0xF9A825 },
      rv:         { len: 7.0, wid: 2.4, hgt: 3.0, color: 0xECEFF1 },
      truck2axle: { len: 8.0, wid: 2.5, hgt: 3.2, color: 0x455A64 },
      truck3axle: { len: 12.0, wid: 2.6, hgt: 3.4, color: 0x37474F },
    };
    function getVehicle3DSpec(type) {
      return window.VEHICLE_3D_SPECS[(type || '').toLowerCase()] || window.VEHICLE_3D_SPECS.car;
    }
  </script>
  <script>
    function getVehicleEmoji(type) {
      switch ((type || '').toLowerCase()) {
        case 'car': return '🚗';
        case 'suv': return '🚙';
        case 'motorcycle': return '🏍️';
        case 'bus': return '🚌';
        case 'rv': return '🚐';
        case 'truck2axle': return '🚚';
        case 'truck3axle': return '🚛';
        default: return '🚗';
      }
    }

    function getVehicleMarkerHTML(type) {
      const t = (type || '').toLowerCase();
      if (t === 'car' || t === 'suv') {
        return `<img src="assets/assets/images/isometric_car.png" style="width:56px; height:56px; object-fit:contain; filter: drop-shadow(0 6px 5px rgba(0,0,0,0.45));" />`;
      }
      return `<div class="vehicle-emoji-container" style="font-size:40px; filter: drop-shadow(0 6px 5px rgba(0,0,0,0.45));">${getVehicleEmoji(type)}</div>`;
    }

    window.initMapbox3D = function(containerId, accessToken, styleUrl, routeJson, waypointsJson, poisJson, vehicleType) {
      const routePoints = JSON.parse(routeJson);
      const waypoints = JSON.parse(waypointsJson);
      const pois = JSON.parse(poisJson);

      window.currentRoutePoints = routePoints;
      window.mapboxMarkers = [];

      mapboxgl.accessToken = accessToken;

      const map = new mapboxgl.Map({
        container: containerId,
        style: styleUrl,
        center: routePoints.length > 0 ? routePoints[0] : [78.9629, 20.5937],
        zoom: 12,
        pitch: 60,
        bearing: -20,
        antialias: true
      });

      map.on('style.load', () => {
        // Add DEM terrain
        map.addSource('mapbox-dem', {
          'type': 'raster-dem',
          'url': 'mapbox://mapbox.mapbox-terrain-dem-v1',
          'tileSize': 512
        });
        map.setTerrain({ 'source': 'mapbox-dem', 'exaggeration': 1.5 });

        // Add 3D Building Layer
        const layers = map.getStyle().layers;
        const labelLayerId = layers.find(
          (layer) => layer.type === 'symbol' && layer.layout['text-field']
        )?.id;

        map.addLayer(
          {
            'id': 'add-3d-buildings',
            'source': 'composite',
            'source-layer': 'building',
            'filter': ['==', 'extrude', 'true'],
            'type': 'fill-extrusion',
            'minzoom': 15,
            'paint': {
              'fill-extrusion-color': '#aaa',
              'fill-extrusion-height': [
                'interpolate',
                ['linear'],
                ['zoom'],
                15,
                0,
                15.05,
                ['get', 'height']
              ],
              'fill-extrusion-base': [
                'interpolate',
                ['linear'],
                ['zoom'],
                15,
                0,
                15.05,
                ['get', 'min_height']
              ],
              'fill-extrusion-opacity': 0.6
            }
          },
          labelLayerId
        );

        // NOTE: a Three.js custom-layer 3D model was tried here, but Mapbox GL
        // v3 changed its custom-layer projection API and distorted the mesh into
        // a vertical streak. We use the reliable 3D-rendered car sprite (the DOM
        // marker below) instead, which renders correctly on the tilted map.
        // window.addVehicle3DModelLayer(map, vehicleType);
      });

      // Add route polyline
      map.on('load', () => {
        map.addSource('route', {
          'type': 'geojson',
          'data': {
            'type': 'Feature',
            'properties': {},
            'geometry': {
              'type': 'LineString',
              'coordinates': []
            }
          }
        });

        map.addLayer({
          'id': 'route-line',
          'type': 'line',
          'source': 'route',
          'layout': {
            'line-join': 'round',
            'line-cap': 'round'
          },
          'paint': {
            'line-color': '#2E75B6',
            'line-width': 6,
            'line-opacity': 0.85
          }
        });
      });

      // Start Marker (always on map)
      if (routePoints.length > 0) {
        new mapboxgl.Marker({ color: '#2ecc71' })
          .setLngLat(routePoints[0])
          .setPopup(new mapboxgl.Popup().setHTML(`<h4>Start Location</h4>`))
          .addTo(map);
      }

      // End Destination Marker (shows dynamically when reached)
      if (routePoints.length > 1) {
        const endMarker = new mapboxgl.Marker({ color: '#e74c3c' })
          .setLngLat(routePoints[routePoints.length - 1])
          .setPopup(new mapboxgl.Popup().setHTML(`<h4>End Destination</h4>`));
        endMarker.closestRouteIdx = routePoints.length - 2;
        window.mapboxMarkers.push(endMarker);
      }

      // Waypoints (show dynamically as vehicle passes)
      waypoints.forEach((wp, index) => {
        // Find closest route index
        let closestIdx = 0;
        let minDist = Infinity;
        routePoints.forEach((p, rIdx) => {
          const dist = Math.pow(p[0] - wp.lng, 2) + Math.pow(p[1] - wp.lat, 2);
          if (dist < minDist) {
            minDist = dist;
            closestIdx = rIdx;
          }
        });

        const marker = new mapboxgl.Marker({ color: '#2E75B6' })
          .setLngLat([wp.lng, wp.lat])
          .setPopup(new mapboxgl.Popup().setHTML(`<h4>Stop ${index + 1}</h4><p>${wp.name || ''}</p>`));
        marker.closestRouteIdx = closestIdx;
        window.mapboxMarkers.push(marker);
      });

      // POI Markers
      pois.forEach((poi) => {
        const el = document.createElement('div');
        el.className = 'poi-marker';
        el.style.backgroundColor = getPoiColor(poi.category);
        el.style.width = '12px';
        el.style.height = '12px';
        el.style.borderRadius = '50%';
        el.style.border = '2px solid white';
        el.style.cursor = 'pointer';

        const popupHTML = `
          <div style="font-family: sans-serif; padding: 4px;">
            <h4 style="margin: 0 0 6px 0; color: #333;">${poi.name}</h4>
            <p style="margin: 0 0 8px 0; font-size: 11px; color: #666;">${poi.address || 'Address not loaded'}</p>
            <button onclick="window.addWaypointFrom3D('${poi.name.replace(/'/g, "\\'")}', ${poi.lat}, ${poi.lng})" 
                    style="background: #2E75B6; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; width: 100%;">
              Add Stop
            </button>
          </div>
        `;

        new mapboxgl.Marker(el)
          .setLngLat([poi.lng, poi.lat])
          .setPopup(new mapboxgl.Popup({ offset: 10 }).setHTML(popupHTML))
          .addTo(map);
      });

      function getPoiColor(category) {
        switch (category) {
          case 'fuel': return '#FF9800';
          case 'hotel': return '#9C27B0';
          case 'restaurant': return '#795548';
          case 'attraction': return '#009688';
          case 'hills': return '#4CAF50';
          case 'temple': return '#FF5722';
          case 'lake': return '#2196F3';
          case 'river': return '#03A9F4';
          case 'viewpoint': return '#3F51B5';
          default: return '#9E9E9E';
        }
      }
      function spawnSmokeParticle(parentEl) {
        const particle = document.createElement('div');
        particle.style.position = 'absolute';
        particle.style.width = '4px';
        particle.style.height = '4px';
        particle.style.borderRadius = '50%';
        particle.style.backgroundColor = 'rgba(180, 180, 180, 0.7)';
        particle.style.left = '26px'; // positioned near rear exhaust
        particle.style.top = '22px';
        particle.style.pointerEvents = 'none';
        particle.style.transition = 'all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1)';
        
        parentEl.appendChild(particle);
        
        const vx = 12 + Math.random() * 12;
        const vy = 4 + Math.random() * 8;
        const finalSize = 10 + Math.random() * 8;
        
        setTimeout(() => {
          particle.style.transform = `translate(${vx}px, ${vy}px)`;
          particle.style.width = finalSize + 'px';
          particle.style.height = finalSize + 'px';
          particle.style.opacity = '0';
        }, 20);
        
        setTimeout(() => {
          particle.remove();
        }, 500);
      }

      // Create vehicle marker (hidden initially at 0, 0)
      const vehicleEl = document.createElement('div');
      vehicleEl.id = 'vehicle-marker';
      vehicleEl.style.width = '56px';
      vehicleEl.style.height = '56px';
      vehicleEl.style.position = 'relative';
      vehicleEl.style.transition = 'transform 0.1s linear';

      const emojiEl = document.createElement('div');
      emojiEl.className = 'driving-wobble';
      emojiEl.style.width = '56px';
      emojiEl.style.height = '56px';
      emojiEl.style.display = 'flex';
      emojiEl.style.alignItems = 'center';
      emojiEl.style.justifyContent = 'center';
      emojiEl.style.position = 'relative';
      emojiEl.innerHTML = getVehicleMarkerHTML(vehicleType);
      vehicleEl.appendChild(emojiEl);

      // Sits flat on the road and turns with the route (like the reference clip)
      // instead of billboarding upright.
      const vehicleMarker = new mapboxgl.Marker({
        element: vehicleEl,
        rotationAlignment: 'map',
        pitchAlignment: 'map'
      })
      .setLngLat([0, 0])
      .addTo(map);

      if (window.smokeInterval) {
        clearInterval(window.smokeInterval);
      }
      window.smokeInterval = setInterval(() => {
        if (vehicleMarker && vehicleMarker.getLngLat().lng !== 0) {
          spawnSmokeParticle(emojiEl);
        }
      }, 100);

      window.currentVehicleMarker = vehicleMarker;
      window.currentMapInstance = map;
      window.currentVehicleType = vehicleType;
    };

    // Builds a simple but real 3D vehicle (body + cabin + wheels) from Three.js
    // primitives in Mapbox's native orientation: X = width, Y = length (travel),
    // Z = up. Built Z-up so no axis-swap rotation is needed in the render matrix.
    function buildVehicleMesh(spec) {
      const group = new THREE.Group();
      const paint = new THREE.MeshStandardMaterial({ color: spec.color, metalness: 0.3, roughness: 0.5 });
      const glass = new THREE.MeshStandardMaterial({ color: 0x9fd3e8, metalness: 0.1, roughness: 0.2 });
      const tyre = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 });

      const bodyH = spec.hgt * 0.55;
      const r = spec.hgt * 0.16;
      const body = new THREE.Mesh(new THREE.BoxGeometry(spec.wid, spec.len, bodyH), paint);
      body.position.z = r + bodyH / 2;
      group.add(body);

      const cabin = new THREE.Mesh(
        new THREE.BoxGeometry(spec.wid * 0.9, spec.len * 0.5, spec.hgt * 0.4), glass);
      cabin.position.set(0, -spec.len * 0.05, r + bodyH + spec.hgt * 0.2);
      group.add(cabin);

      const wheelGeo = new THREE.CylinderGeometry(r, r, spec.wid * 0.15, 16);
      const xs = [spec.wid / 2 - 0.05, -spec.wid / 2 + 0.05];
      const ys = [spec.len * 0.32, -spec.len * 0.32];
      for (const x of xs) for (const y of ys) {
        const w = new THREE.Mesh(wheelGeo, tyre);
        w.rotation.z = Math.PI / 2; // cylinder axis Y -> X, so the axle spans the width
        w.position.set(x, y, r);
        group.add(w);
      }
      return group;
    }

    // Native Mapbox-v3 custom layer that renders the 3D vehicle. Position and
    // heading are read each frame from window.vehicleState.
    window.addVehicle3DModelLayer = function(map, vehicleType) {
      if (typeof THREE === 'undefined') {
        console.warn('Three.js not loaded — keeping 2D marker');
        return;
      }
      if (map.getLayer('vehicle-3d-model')) return;
      const spec = getVehicle3DSpec(vehicleType);
      const EXAGGERATION = 6; // draw the vehicle larger than life so it reads at nav zoom
      window.vehicleState = { lng: 0, lat: 0, bearingRad: 0, visible: false };
      console.log('[3D vehicle] adding custom layer', spec);

      const layer = {
        id: 'vehicle-3d-model',
        type: 'custom',
        renderingMode: '3d',
        onAdd: function (m, gl) {
          try {
            this.camera = new THREE.Camera();
            this.scene = new THREE.Scene();
            const d1 = new THREE.DirectionalLight(0xffffff, 1.0); d1.position.set(50, -70, 100).normalize(); this.scene.add(d1);
            const d2 = new THREE.DirectionalLight(0xffffff, 0.6); d2.position.set(-50, 70, 60).normalize(); this.scene.add(d2);
            this.scene.add(new THREE.AmbientLight(0xffffff, 0.7));
            this.model = buildVehicleMesh(spec);
            this.scene.add(this.model);
            this.map = m;
            this.renderer = new THREE.WebGLRenderer({ canvas: m.getCanvas(), context: gl, antialias: true });
            this.renderer.autoClear = false;
            // Real 3D vehicle exists — hide the flat DOM sprite so they don't overlap.
            const wob = document.querySelector('#vehicle-marker .driving-wobble');
            if (wob) wob.style.display = 'none';
            console.log('[3D vehicle] onAdd OK — renderer + model ready');
          } catch (e) {
            console.error('[3D vehicle] onAdd failed:', e);
          }
        },
        render: function (gl, matrix) {
          const s = window.vehicleState;
          if (!s || !s.visible || !this.model || !this.renderer) return;
          if (!this._loggedRender) {
            this._loggedRender = true;
            console.log('[3D vehicle] first render at', s.lng, s.lat);
          }
          const merc = mapboxgl.MercatorCoordinate.fromLngLat([s.lng, s.lat], 0);
          const scale = merc.meterInMercatorCoordinateUnits() * EXAGGERATION;
          // Model is already Z-up; only rotate about Z for heading. Dart bearing =
          // atan2(dLng,dLat) (0=N, clockwise); tune the offset if it faces wrong.
          const heading = -s.bearingRad;
          const rotZ = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(0, 0, 1), heading);
          const l = new THREE.Matrix4()
            .makeTranslation(merc.x, merc.y, merc.z)
            .scale(new THREE.Vector3(scale, -scale, scale))
            .multiply(rotZ);
          this.camera.projectionMatrix = new THREE.Matrix4().fromArray(matrix).multiply(l);
          this.renderer.resetState();
          this.renderer.render(this.scene, this.camera);
          this.map.triggerRepaint();
        }
      };
      map.addLayer(layer);
    };

    window.update3DVehiclePosition = function(lng, lat, rotationRad, speedModifier, customZoom) {
      // Feed the real 3D model layer.
      if (window.vehicleState) {
        window.vehicleState.lng = lng;
        window.vehicleState.lat = lat;
        window.vehicleState.bearingRad = rotationRad;
        window.vehicleState.visible = true;
        if (window.currentMapInstance) window.currentMapInstance.triggerRepaint();
      }

      if (window.currentVehicleMarker && window.currentMapInstance) {
        const map = window.currentMapInstance;
        const position = [lng, lat];
        const type = (window.currentVehicleType || '').toLowerCase();

        let rotationDeg;
        if (type === 'car' || type === 'suv') {
          rotationDeg = (rotationRad * (180 / Math.PI)) + 45; // 45 degree offset for isometric car
        } else {
          rotationDeg = (rotationRad * (180 / Math.PI)) + 90; // 90 degree offset for emojis
        }

        window.currentVehicleMarker.setLngLat(position);
        window.currentVehicleMarker.setRotation(rotationDeg);
        
        if (!window.animatedRouteCoords) {
          window.animatedRouteCoords = [];
        }
        
        // Clear markers when starting fresh
        if (window.animatedRouteCoords.length === 0) {
          if (window.mapboxMarkers) {
            window.mapboxMarkers.forEach(m => m.remove());
          }
        }
        
        window.animatedRouteCoords.push(position);
        
        // Grow route line dynamically
        const source = map.getSource('route');
        if (source) {
          source.setData({
            'type': 'Feature',
            'properties': {},
            'geometry': {
              'type': 'LineString',
              'coordinates': window.animatedRouteCoords
            }
          });
        }

        // Pop up markers dynamically as vehicle passes
        const currentIdx = window.animatedRouteCoords.length;
        if (window.mapboxMarkers) {
          window.mapboxMarkers.forEach(marker => {
            if (currentIdx >= marker.closestRouteIdx) {
              if (!marker.getElement().parentElement) {
                marker.addTo(map);
                const el = marker.getElement();
                el.style.transform = 'scale(0)';
                el.style.transition = 'transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
                setTimeout(() => {
                  el.style.transform = 'scale(1)';
                }, 50);
              }
            } else {
              if (marker.getElement().parentElement) {
                marker.remove();
              }
            }
          });
        }
        
        const motionDeg = rotationRad * (180 / Math.PI);
        const speed = speedModifier || 1.0;
        if (!window.cameraTickCounter) window.cameraTickCounter = 0;
        window.cameraTickCounter++;

        // Steady "chase camera" like Google Maps / the reference clip: fixed tilt,
        // bearing locked to the direction of travel, car framed in the lower third
        // with the road ahead. A gentle orbit only when parked at a stop.
        let pitchVal = 62;   // 3D tilt
        let zoomVal = 17.2;  // close, navigation-style
        let targetBearing = motionDeg;

        if (speed === 0.0) {
          // Slow scenic orbit while stopped at a waypoint/toll/destination.
          pitchVal = 58;
          zoomVal = customZoom || 17.4;
          targetBearing = motionDeg + ((window.cameraTickCounter * 0.35) % 360);
        }

        // Smooth, shortest-path bearing interpolation to avoid snapping on turns.
        const currentBearing = map.getBearing() || 0;
        let diff = (targetBearing - currentBearing) % 360;
        if (diff < -180) diff += 360;
        if (diff > 180) diff -= 360;
        const bearingVal = (currentBearing + diff * 0.14) % 360;

        // Push the focal point down so the car sits low and the road ahead fills
        // the frame (padding.top reserves space, moving the centered car lower).
        const h = map.getContainer().clientHeight || 600;
        map.jumpTo({
          center: position,
          zoom: zoomVal,
          pitch: pitchVal,
          bearing: bearingVal,
          padding: { top: Math.round(h * 0.42), bottom: 0, left: 0, right: 0 }
        });
      }
    };

    window.hide3DVehicle = function() {
      if (window.vehicleState) {
        window.vehicleState.visible = false;
        if (window.currentMapInstance) window.currentMapInstance.triggerRepaint();
      }
      if (window.currentVehicleMarker) {
        window.currentVehicleMarker.setLngLat([0, 0]);
      }
      window.animatedRouteCoords = [];
      
      // Restore all markers to the map immediately
      if (window.mapboxMarkers && window.currentMapInstance) {
        const map = window.currentMapInstance;
        window.mapboxMarkers.forEach(marker => {
          marker.addTo(map);
          const el = marker.getElement();
          el.style.transform = 'scale(1)';
          el.style.transition = 'none';
        });
      }
      
      // Restore full route line
      if (window.currentMapInstance && window.currentRoutePoints) {
        const source = window.currentMapInstance.getSource('route');
        if (source) {
          source.setData({
            'type': 'Feature',
            'properties': {},
            'geometry': {
              'type': 'LineString',
              'coordinates': window.currentRoutePoints
            }
          });
        }
      }
    };
  </script>

  <script>
    // Force unregister all service workers to bust cache
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
        }
      });
      caches.keys().then(function(names) {
        for (var name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
</head>
