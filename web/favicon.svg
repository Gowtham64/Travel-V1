    <path d="M50 14 C 65 14 76 25 76 40 C 76 58 50 84 50 84 C 50 84 24 58 24 40 C 24 25 35 14 50 14 Z" fill="#fff"/>
    <!-- compass needle inside (A) — its 4 points also read as signpost directions (D) -->
    <path d="M50 26 L56 40 L50 54 L44 40 Z" fill="#0f766e"/>
    <path d="M36 40 L50 36 L64 40 L50 44 Z" fill="#0f766e" opacity="0.55"/>
